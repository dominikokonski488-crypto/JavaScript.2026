<html>
    <head>
        <title>proste obliczenia</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <div style="color: red; font-size: 50px;">
            <script>
                var liczba1 = prompt("A=", "");
                var A_Okon = parseFloat(liczba1);
                var liczba2 = prompt("B=", "");
                var B_Okon = parseFloat(liczba2);
                document.write("A=" + A_Okon + " B=" + B_Okon + "<br>");
                document.write("("+A_Okon+" + "+B_Okon+")^3="+"("+A_Okon+" + "+B_Okon+")^3="+Math.pow((A_Okon+B_Okon),3));
            </script>
        </div>
    <input type="button" value="zamknij okno" onclick="window.close()"/>
</body>
</html>
