<!DOCTYPE html>
 <head>
    Zastosowanie:
Jest używany kiedy użytkownik ma wpisać coś np. zanim wejdzie w dany moduł strony.<br> Np. hasło.
Użytkownik po wpisaniu wartość może nacisnął „OK.” <br>albo „Cancel” Jeżeli użytkownik kliknie „OK.”
metoda zwraca wpisaną wartość, a w przeciwnym wypadku zwraca null. <br>
 <script type="text/javascript">
 function show_prompt()
 {
 var name=prompt("Napisz imię","Imię Nazwisko");
 if (name!=null && name!="")
 {
 document.write("Witaj " + name + "! jak się masz?");
 }
 }
 </script>
</head>
<body>
 <input type="button" onclick="show_prompt()" value="Pokaż prompt box" />
 <input type="button" value="zamknij okno" onclick="window.close()"/>
</body>
</html>
