<head>
<title>proste obliczenia</title>
<meta charset="utf-8">
</head>
<body>
<div style="color:red;font-size:50px;">
<script language="javascript">
var liczba1=prompt("daj mianownik","m");
var m_OKO=parseFloat(liczba1);

document.write("m="+m_OKO+"<br>");
m1=m_OKO+1;
m2=(m_OKO+2)*m_OKO;
m3=(m_OKO+1)*m_OKO;
document.write("1/"+m_OKO+"=1/"+m1+"+1/"+m2+"+1/"+m3+"<br>");
</script>
</div>
