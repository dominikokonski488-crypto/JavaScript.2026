    <textarea readonly>&lt;!DOCTYPE html&gt;
&lt;html lang="pl"&gt;

    &lt;h1&gt;Zadanie 28&lt;/h1&gt;
    &lt;h2&gt;1. Rodzaje "filozofii-paradygmatów" programowania:&lt;/h2&gt;
    &lt;p&gt;1) Programowanie strukturalne&lt;/p&gt;
    &lt;p&gt;2) Programowanie obiektowe&lt;/p&gt;
    &lt;h2&gt;2. Programowanie strukturalne&lt;/h2&gt;
    &lt;p&gt;Paradygmat programowania opierający się na podziale kodu źródłowego programu na procedury i hierarchicznie ułożone bloki z wykorzystaniem struktur kontrolnych w postaci instrukcji wyboru i pętli. Zwiększa czytelność i ułatwia analizę programu.&lt;/p&gt;
    &lt;h2&gt;3. Opis programowania obiektowego&lt;/h2&gt;
    &lt;p&gt;Programowanie obiektowe definiuje program za pomocą obiektów. Obiekt ma stan (pola) i zachowanie (metody), dzięki czemu komunikuje się z innymi obiektami.&lt;/p&gt;
    &lt;h2&gt;4. Dlaczego stosujemy programowanie obiektowe?&lt;/h2&gt;
    &lt;p&gt;Lepiej odwzorowuje rzeczywistość, pozwala lepiej zarządzać pamięcią i wykorzystać ponownie przetestowane klasy.&lt;/p&gt;
    &lt;h2&gt;Terminologia&lt;/h2&gt;
    &lt;p&gt;&lt;strong&gt;Klasa:&lt;/strong&gt; wzór obiektu.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Obiekt:&lt;/strong&gt; instancja klasy.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Właściwość:&lt;/strong&gt; dane obiektu.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Metoda:&lt;/strong&gt; czynność wykonywana przez obiekt.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Konstruktor:&lt;/strong&gt; metoda inicjalizująca obiekt.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Destruktor:&lt;/strong&gt; metoda niszcząca obiekt.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Dziedziczenie:&lt;/strong&gt; tworzenie klasy na podstawie innej klasy.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Hermetyzacja:&lt;/strong&gt; ukrywanie części pól i metod.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Polimorfizm:&lt;/strong&gt; możliwość różnego działania obiektu w zależności od potrzeb.&lt;/p&gt;
