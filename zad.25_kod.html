<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zadanie 25</title>
</head>
<body>
<div style="color:blue;font-size:36px;">Zadanie 25</div>
<script language="JavaScript">
var a_Oko = parseFloat(prompt("Podaj a=", "0"));
var b_Oko = parseFloat(prompt("Podaj b=", "0"));
var suma_Oko = a_Oko + b_Oko;
var roznica_Oko = a_Oko - b_Oko;
var iloczyn_Oko = a_Oko * b_Oko;

document.write("a = " + a_Oko + "<br>");
document.write("b = " + b_Oko + "<br>");
document.write("suma = " + suma_Oko.toFixed(2) + "<br>");
document.write("różnica = " + roznica_Oko.toFixed(2) + "<br>");
document.write("iloczyn = " + iloczyn_Oko.toFixed(2) + "<br>");
</script>
<input type="button" value="zamknij okno" onclick="window.close()"/>
</body>
