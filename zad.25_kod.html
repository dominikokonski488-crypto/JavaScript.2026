<!DOCTYPE html>
<html>
<body>

<script>
// Autor: uczen

let No = Number(prompt("Podaj No [sztuk]:"));
let t = Number(prompt("Podaj t [lat]:"));
let T12 = Number(prompt("Podaj T1/2 [lat]:"));

let lambda = Math.log(2) / T12;
let N = No * Math.pow(Math.E, -lambda * t);

document.write("<div style='color:navy; font-size:36px;'>");
document.write("N0=" + No.toFixed(0) + " [sztuk]<br>");
document.write("t=" + t.toFixed(0) + " [lat]<br>");
document.write("T1/2=" + T12.toFixed(0) + " [lat]<br>");
document.write("Lambda=" + lambda.toFixed(8) + " [1/rok]<br>");
document.write("N=" + N.toFixed(7) + " [sztuk]");
document.write("</div>");

</script>

</body>
</html>
