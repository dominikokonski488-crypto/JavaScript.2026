 <script language="JavaScript">
function Drabina_OKO(d_OKO,x_OKO)
{
 d_OKO_liczba=parseFloat(d_OKO)
 x_OKO_liczba=parseFloat(x_OKO)
 drabina_OKO_wynik=Math.sqrt(Math.pow(d_OKO_liczba,2)+Math.pow(x_OKO_liczba,2))

 document.getElementsByName('drabina')[0].value=drabina_OKO_wynik.toFixed(2);
 document.getElementsByName('alfa')[0].value=alfa_OKO_wynik.toFixed(2);
 alert("Drabina="+drabina_OKO_wynik.toFixed(2)+"\nAlfa="+alfa_OKO_wynik.toFixed(2));
}
 </script>
